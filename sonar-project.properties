# SonarCloud configuration
# See: https://sonarcloud.io/documentation/analysis/scan/sonarscanner/

sonar.projectKey=chat-app
sonar.projectName=Chat App – Full Stack Django
sonar.projectVersion=2.0

# Source directories
sonar.sources=django_server/apps,client/src

# Test directories
sonar.tests=django_server/tests,tests/e2e

# Exclusions
sonar.exclusions=\
  **/migrations/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/__pycache__/**,\
  **/*.min.js,\
  **/staticfiles/**,\
  **/media/**

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=django_server/coverage.xml

# JavaScript / TypeScript
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info
sonar.typescript.tsconfigPath=client/tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8
