name: 🚀 Production CI/CD — Chat App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests (emergency deploy only)"
        required: false
        default: "false"
        type: boolean

# Cancel in-progress runs on new push to same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE_DJANGO: nikhil2523/chat-app-django
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || 'nikhil2523' }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  CLIENT_URL: ${{ secrets.CLIENT_URL || 'http://16.113.127.132' }}
  VITE_SERVER: ${{ secrets.VITE_SERVER || '' }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || secrets.SONARQUBE_TOKEN || vars.SONAR_TOKEN }}
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 1 — Code Quality: Lint & Formatting
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  # ─── 1a. Python Lint ───────────────────────────────────────────────────────
  python_lint:
    name: "🐍 Python Lint (flake8 + black + isort)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: django_server/requirements.txt

      - name: Install lint tools
        run: pip install flake8 black isort

      - name: flake8 — style & syntax
        run: |
          flake8 . \
            --max-line-length=120 \
            --exclude=migrations,__pycache__,.git,staticfiles \
            --extend-ignore=E501,W503,W504 \
            --statistics \
            --count
        continue-on-error: true

      - name: black — format check
        run: |
          black --check --diff --line-length 120 . \
            --exclude "/(migrations|__pycache__|staticfiles)/"
        continue-on-error: true

      - name: isort — import order check
        run: |
          isort --check-only --diff . \
            --skip migrations \
            --skip __pycache__
        continue-on-error: true

  # ─── 1b. Python Syntax Validation ─────────────────────────────────────────
  python_syntax:
    name: "🐍 Python Syntax Validation"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate all .py files parse correctly
        run: |
          python -c "
          import ast, glob, sys
          errors = []
          files = glob.glob('**/*.py', recursive=True)
          for f in files:
              if any(skip in f for skip in ['__pycache__', '.git']):
                  continue
              try:
                  ast.parse(open(f, encoding='utf-8').read())
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('❌ Syntax errors:')
              for e in errors: print(e)
              sys.exit(1)
          print(f'✅ {len(files)} Python files — all valid syntax')
          "

      - name: Django system check
        run: python manage.py check
        env:
          SECRET_KEY: ci-test-secret-key-12345
          DB_ENGINE: sqlite3
          USE_REDIS: "False"
          DEBUG: "True"
          MESSAGE_ENCRYPTION_KEY: "12345678901234567890123456789012"

  # ─── 1c. Frontend Lint ─────────────────────────────────────────────────────
  frontend_lint:
    name: "⚛️ Frontend Lint & TypeScript Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint — JavaScript/TypeScript lint
        run: npm run lint -- --max-warnings 50 || true
        continue-on-error: true

      - name: TypeScript — type check (strict)
        run: npx tsc --noEmit
        continue-on-error: true

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 2 — Security: SAST & Secret Detection
# ═══════════════════════════════════════════════════════════════════════════════

  # ─── 2a. Bandit SAST ───────────────────────────────────────────────────────
  bandit_sast:
    name: "🔒 Bandit SAST (Python Security)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Bandit scan — medium+ severity
        run: |
          bandit -r apps/ core/ \
            -x apps/authentication/migrations,apps/chat/migrations,apps/messages_app/migrations \
            --severity-level medium \
            --confidence-level medium \
            -f json -o ../bandit-report.json || true
          bandit -r apps/ core/ \
            -x apps/authentication/migrations,apps/chat/migrations,apps/messages_app/migrations \
            --severity-level medium \
            --confidence-level medium || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-sast-report
          path: bandit-report.json
          retention-days: 30

  # ─── 2b. Secret Detection (Gitleaks) ──────────────────────────────────────
  secret_detection:
    name: "🔑 Secret Detection (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — scan for hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

  # ─── 2c. Semgrep SAST ─────────────────────────────────────────────────────
  semgrep_sast:
    name: "🛡️ Semgrep SAST Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install semgrep
        run: pip install semgrep

      - name: Semgrep — Python security rules
        run: |
          semgrep \
            --config=p/python \
            --config=p/django \
            --config=p/jwt \
            --config=p/owasp-top-ten \
            django_server/ \
            --exclude=migrations \
            --exclude=__pycache__ \
            --json -o semgrep-report.json || true
          semgrep \
            --config=p/python \
            --config=p/django \
            django_server/ \
            --exclude=migrations \
            --exclude=__pycache__ || true
        continue-on-error: true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sast-report
          path: semgrep-report.json
          retention-days: 30

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 3 — Dependency Audits
# ═══════════════════════════════════════════════════════════════════════════════

  # ─── 3a. Python Dependency Audit (pip-audit + Safety) ─────────────────────
  python_dep_audit:
    name: "📦 Python Dependency Audit (pip-audit)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: django_server/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip-audit — CVE check on all dependencies
        run: |
          pip install -r requirements.txt
          pip-audit --requirement requirements.txt \
            --format json \
            --output pip-audit-report.json || true
          pip-audit --requirement requirements.txt || true
        continue-on-error: true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: django_server/pip-audit-report.json
          retention-days: 30

  # ─── 3b. Python Outdated Packages Check ───────────────────────────────────
  python_outdated:
    name: "📊 Python Outdated Packages"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: List outdated packages
        run: |
          echo "📦 Checking for outdated packages..."
          pip list --outdated --format=columns || true
          pip check || true
        continue-on-error: true

  # ─── 3c. npm Audit ─────────────────────────────────────────────────────────
  npm_audit:
    name: "📦 npm Dependency Audit"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: npm audit — CVE check (high+)
        run: |
          npm audit --audit-level=high --json > npm-audit-report.json 2>&1 || true
          npm audit --audit-level=high || true
        continue-on-error: true

      - name: Check for outdated npm packages
        run: npm outdated || true
        continue-on-error: true

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: client/npm-audit-report.json
          retention-days: 30

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 4 — Tests
# ═══════════════════════════════════════════════════════════════════════════════

  # ─── 4a. Backend Tests ─────────────────────────────────────────────────────
  backend_tests:
    name: "🧪 Backend Tests + Coverage"
    runs-on: ubuntu-latest
    needs: [python_syntax]
    defaults:
      run:
        working-directory: django_server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: django_server/requirements.txt

      - name: Install all dependencies (including test)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-asyncio pytest-cov factory-boy faker channels[daphne]

      - name: Run pytest with coverage
        run: |
          DB_ENGINE=sqlite3 pytest tests/ \
            --cov=apps \
            --cov-report=xml:coverage.xml \
            --cov-report=html:coverage_html \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            -v \
            --timeout=60 \
            --tb=short \
            -p no:warnings
        env:
          SECRET_KEY: ci-test-secret-key-12345
          DB_ENGINE: sqlite3
          USE_REDIS: "False"
          DEBUG: "True"
          MESSAGE_ENCRYPTION_KEY: "12345678901234567890123456789012"
        continue-on-error: true

      - name: Upload coverage XML (for SonarCloud)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: |
            django_server/coverage.xml
            django_server/coverage_html/
          retention-days: 14

  # ─── 4b. Frontend Tests ─────────────────────────────────────────────────────
  frontend_tests:
    name: "🧪 Frontend Tests (Vitest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Vitest unit tests
        run: npm test -- --passWithNoTests --reporter=verbose
        continue-on-error: true

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 5 — Build
# ═══════════════════════════════════════════════════════════════════════════════

  # ─── 5a. Frontend Production Build ─────────────────────────────────────────
  frontend_build:
    name: "🏗️ Frontend Production Build"
    runs-on: ubuntu-latest
    needs: [frontend_lint, frontend_tests]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build React SPA (production)
        env:
          VITE_SERVER: ${{ env.VITE_SERVER }}
        run: npm run build:ci

      - name: Verify build output
        run: |
          echo "📦 Build output:"
          ls -lah dist/
          [ -f dist/index.html ] && echo "✅ index.html present" || (echo "❌ index.html MISSING" && exit 1)
          du -sh dist/

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/dist/
          retention-days: 7

  # ─── 5b. Docker Build & Push ───────────────────────────────────────────────
  build_and_push:
    name: "🐳 Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: [python_syntax, backend_tests, frontend_build]
    if: github.ref == 'refs/heads/main'
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_DJANGO }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Django Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./django_server
          file: ./django_server/Dockerfile
          push: ${{ env.DOCKER_PASSWORD != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Docker image size report
        run: |
          docker images ${{ env.DOCKER_IMAGE_DJANGO }} || true

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 6 — Post-Build Security & Code Analysis
# ═══════════════════════════════════════════════════════════════════════════════

  # ─── 6a. Trivy Container Security Scan ────────────────────────────────────
  trivy_scan:
    name: "🛡️ Trivy Container Security Scan"
    runs-on: ubuntu-latest
    needs: [build_and_push]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy — CRITICAL & HIGH CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.DOCKER_IMAGE_DJANGO }}:latest"
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
        continue-on-error: true

      - name: Trivy — table format (human readable)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.DOCKER_IMAGE_DJANGO }}:latest"
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
        continue-on-error: true

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ─── 6b. SonarCloud Analysis ───────────────────────────────────────────────
  sonar_analysis:
    name: "📊 SonarCloud Code Analysis"
    runs-on: ubuntu-latest
    needs: [backend_tests, frontend_build]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage report
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-report
          path: django_server/
        continue-on-error: true

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY || vars.SONAR_PROJECT_KEY || 'nikhilchandurkar_chat-app' }}
            -Dsonar.organization=${{ secrets.SONAR_ORG || vars.SONAR_ORG || 'nikhilchandurkar' }}
            -Dsonar.sources=django_server/apps,client/src
            -Dsonar.exclusions=**/migrations/**,**/node_modules/**,**/dist/**,**/__pycache__/**,**/staticfiles/**,**/media/**,**/*.min.js
            -Dsonar.python.coverage.reportPaths=django_server/coverage.xml
            -Dsonar.python.version=3.12
            -Dsonar.javascript.lcov.reportPaths=client/coverage/lcov.info
        continue-on-error: true

  # ─── 6c. CodeQL Analysis ──────────────────────────────────────────────────
  codeql_analysis:
    name: "🔬 CodeQL Security Analysis"
    runs-on: ubuntu-latest
    needs: [python_syntax]
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
        continue-on-error: true

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 7 — Deploy to EC2
# ═══════════════════════════════════════════════════════════════════════════════
  deploy:
    name: "🚀 Deploy to EC2 Production"
    runs-on: [self-hosted, linux]
    needs: [build_and_push, trivy_scan, bandit_sast, python_dep_audit]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://16.113.127.132
    steps:
      - name: Checkout repository on server
        uses: actions/checkout@v4

      # ── Pre-deploy: System health check ────────────────────────────────────
      - name: Pre-deploy system check
        run: |
          echo "🖥️  Server info:"
          uname -a
          echo ""
          echo "💾 Disk usage:"
          df -h /
          echo ""
          echo "🐳 Docker version:"
          docker --version
          echo ""
          echo "📦 Running containers:"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      # ── Docker cleanup ─────────────────────────────────────────────────────
      - name: Docker system prune (safe cleanup)
        run: |
          docker container prune -f || true
          docker image prune -f || true
          echo "✅ Docker cleanup complete"

      # ── Setup directories ──────────────────────────────────────────────────
      - name: Setup deployment directories
        run: |
          sudo mkdir -p /opt/chat-app/frontend
          sudo mkdir -p /opt/chat-app/redis_data
          sudo mkdir -p /opt/chat-app/media
          sudo mkdir -p /opt/chat-app/logs
          sudo mkdir -p /opt/chat-app/mysql_data
          sudo chown -R $USER:$USER /opt/chat-app
          sudo chmod -R 775 /opt/chat-app
          sudo chmod -R 777 /opt/chat-app/logs /opt/chat-app/media

      # ── Download frontend artifact ─────────────────────────────────────────
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: /tmp/frontend_dist

      # ── Deploy frontend ────────────────────────────────────────────────────
      - name: Deploy frontend static files to Nginx root
        run: |
          rm -rf /opt/chat-app/frontend/*
          cp -r /tmp/frontend_dist/. /opt/chat-app/frontend/
          rm -rf /tmp/frontend_dist
          echo "✅ Frontend files:"
          ls /opt/chat-app/frontend/

      # ── Nginx config ───────────────────────────────────────────────────────
      - name: Update Nginx configuration
        run: |
          if [ -f "nginx.conf" ]; then
            sudo cp nginx.conf /etc/nginx/sites-available/chatapp
            sudo ln -sf /etc/nginx/sites-available/chatapp /etc/nginx/sites-enabled/chatapp
            sudo rm -f /etc/nginx/sites-enabled/default
            if sudo nginx -t 2>&1; then
              sudo systemctl restart nginx && echo "✅ Nginx restarted" || sudo systemctl reload nginx
            else
              echo "❌ Nginx config invalid — keeping previous config"
              sudo nginx -t
            fi
          fi

      # ── Docker Hub login ───────────────────────────────────────────────────
      - name: Login to Docker Hub
        run: |
          if [ -n "${{ env.DOCKER_PASSWORD }}" ]; then
            echo "${{ env.DOCKER_PASSWORD }}" | docker login -u "${{ env.DOCKER_USERNAME }}" --password-stdin
          fi

      # ── Pull latest image ─────────────────────────────────────────────────
      - name: Pull latest Django image
        run: |
          docker pull ${{ env.DOCKER_IMAGE_DJANGO }}:latest
          echo "✅ Image pulled: ${{ env.DOCKER_IMAGE_DJANGO }}:latest"

      # ── Remove legacy containers ───────────────────────────────────────────
      - name: Remove legacy containers (Node.js / PostgreSQL)
        run: |
          for c in chat_app nodejs-app-container node_backend chat_postgres; do
            if docker ps -a --format '{{.Names}}' | grep -q "^${c}$"; then
              echo "Removing legacy container: $c"
              docker stop $c 2>/dev/null || true
              docker rm $c 2>/dev/null || true
            fi
          done
          echo "✅ Legacy containers cleaned"

      # ── MySQL 8 ────────────────────────────────────────────────────────────
      - name: Ensure MySQL 8 container is running
        run: |
          if ! docker ps --format '{{.Names}}' | grep -q '^chat_mysql$'; then
            echo "🐬 Starting MySQL 8..."
            docker rm chat_mysql 2>/dev/null || true
            sudo chown -R 999:999 /opt/chat-app/mysql_data 2>/dev/null || true
            docker run -d \
              --name chat_mysql \
              --restart unless-stopped \
              -e MYSQL_DATABASE=chat_db \
              -e MYSQL_USER=chat_user \
              -e MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD || 'chat_password' }} \
              -e MYSQL_ROOT_PASSWORD=chat_root_password \
              -v /opt/chat-app/mysql_data:/var/lib/mysql \
              -p 127.0.0.1:3306:3306 \
              mysql:8.0 \
              --character-set-server=utf8mb4 \
              --collation-server=utf8mb4_unicode_ci \
              --default-authentication-plugin=mysql_native_password
            echo "⏳ Waiting for MySQL to initialize (20s)..."
            sleep 20
          else
            echo "✅ MySQL already running"
          fi
          for i in $(seq 1 20); do
            if docker exec chat_mysql mysqladmin ping -uchat_user -p${{ secrets.MYSQL_PASSWORD || 'chat_password' }} --silent 2>/dev/null; then
              echo "✅ MySQL accepting connections (attempt $i)"
              break
            fi
            echo "⏳ Waiting for MySQL ($i/20)..."
            sleep 3
          done

      # ── Redis 7 ───────────────────────────────────────────────────────────
      - name: Ensure Redis 7 container is running
        run: |
          if ! docker ps --format '{{.Names}}' | grep -q '^chat_redis$'; then
            echo "🔴 Starting Redis 7..."
            docker run -d \
              --name chat_redis \
              --restart unless-stopped \
              -p 127.0.0.1:6379:6379 \
              -v /opt/chat-app/redis_data:/data \
              redis:7-alpine \
              redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
            sleep 3
          fi
          docker exec chat_redis redis-cli ping | grep -q PONG && echo "✅ Redis healthy" || echo "⚠️ Redis not responding"

      # ── Grant MySQL privileges ─────────────────────────────────────────────
      - name: Grant MySQL user privileges
        run: |
          docker exec chat_mysql mysql -uroot -pchat_root_password -e "
            CREATE DATABASE IF NOT EXISTS chat_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE USER IF NOT EXISTS 'chat_user'@'%' IDENTIFIED WITH mysql_native_password BY '${{ secrets.MYSQL_PASSWORD || 'chat_password' }}';
            ALTER USER 'chat_user'@'%' IDENTIFIED WITH mysql_native_password BY '${{ secrets.MYSQL_PASSWORD || 'chat_password' }}';
            GRANT ALL PRIVILEGES ON chat_db.* TO 'chat_user'@'%';
            FLUSH PRIVILEGES;
          " 2>/dev/null && echo "✅ MySQL privileges granted" || echo "⚠️ MySQL grant completed with warnings"

      # ── Deploy Daphne ASGI ─────────────────────────────────────────────────
      - name: Deploy Django Daphne server (port 3000)
        run: |
          echo "🚀 Deploying chat_django_daphne..."
          docker stop chat_django_daphne 2>/dev/null || true
          docker rm chat_django_daphne 2>/dev/null || true
          docker run -d \
            --name chat_django_daphne \
            --restart unless-stopped \
            --network host \
            -e PORT=3000 \
            -e DEBUG=False \
            -e SECRET_KEY='${{ secrets.DJANGO_SECRET_KEY || 'django-insecure-chat-app-production-secret-key-change-me-321' }}' \
            -e ADMIN_SECRET_KEY='${{ secrets.ADMIN_SECRET_KEY || 'chat_app_admin_secret' }}' \
            -e DB_ENGINE=mysql \
            -e MYSQL_DATABASE=chat_db \
            -e MYSQL_USER=chat_user \
            -e MYSQL_PASSWORD='${{ secrets.MYSQL_PASSWORD || 'chat_password' }}' \
            -e MYSQL_HOST=127.0.0.1 \
            -e MYSQL_PORT=3306 \
            -e DB_CONN_MAX_AGE=600 \
            -e REDIS_URL='redis://127.0.0.1:6379/0' \
            -e USE_REDIS=True \
            -e CLIENT_URL='${{ env.CLIENT_URL }}' \
            -e ALLOWED_HOSTS='*' \
            -e EMAIL_HOST=smtp.gmail.com \
            -e EMAIL_PORT=587 \
            -e EMAIL_SECURE=false \
            -e EMAIL_USER='${{ secrets.EMAIL_USER }}' \
            -e EMAIL_PASS='${{ secrets.EMAIL_PASS }}' \
            -e MESSAGE_ENCRYPTION_KEY='${{ secrets.MESSAGE_ENCRYPTION_KEY || '12345678901234567890123456789012' }}' \
            -v /opt/chat-app/media:/app/media \
            -v /opt/chat-app/logs:/app/logs \
            ${{ env.DOCKER_IMAGE_DJANGO }}:latest
          echo "⏳ Waiting for container to start..."
          sleep 8

      # ── Run migrations ─────────────────────────────────────────────────────
      - name: Apply database migrations
        run: |
          docker exec chat_django_daphne python manage.py migrate --noinput || \
            docker exec chat_django_daphne python manage.py migrate --noinput --fake-initial || \
            echo "⚠️ Migration completed with warnings"
          docker exec chat_django_daphne python manage.py collectstatic --noinput 2>/dev/null || true
        continue-on-error: true

      # ── Deploy Celery Worker ───────────────────────────────────────────────
      - name: Deploy Celery worker
        run: |
          docker stop chat_celery_worker 2>/dev/null || true
          docker rm chat_celery_worker 2>/dev/null || true
          docker run -d \
            --name chat_celery_worker \
            --restart unless-stopped \
            --network host \
            -e DEBUG=False \
            -e SECRET_KEY='${{ secrets.DJANGO_SECRET_KEY || 'django-insecure-chat-app-production-secret-key-change-me-321' }}' \
            -e DB_ENGINE=mysql \
            -e MYSQL_DATABASE=chat_db \
            -e MYSQL_USER=chat_user \
            -e MYSQL_PASSWORD='${{ secrets.MYSQL_PASSWORD || 'chat_password' }}' \
            -e MYSQL_HOST=127.0.0.1 \
            -e MYSQL_PORT=3306 \
            -e DB_CONN_MAX_AGE=600 \
            -e REDIS_URL='redis://127.0.0.1:6379/0' \
            -e USE_REDIS=True \
            -e CELERY_CONCURRENCY=2 \
            -e EMAIL_USER='${{ secrets.EMAIL_USER }}' \
            -e EMAIL_PASS='${{ secrets.EMAIL_PASS }}' \
            -e MESSAGE_ENCRYPTION_KEY='${{ secrets.MESSAGE_ENCRYPTION_KEY || '12345678901234567890123456789012' }}' \
            -v /opt/chat-app/media:/app/media \
            ${{ env.DOCKER_IMAGE_DJANGO }}:latest \
            celery -A core worker -l info --concurrency=2 --max-memory-per-child=150000
          echo "✅ Celery worker started"

      # ── Health check ───────────────────────────────────────────────────────
      - name: Backend health check
        run: |
          echo "⏳ Waiting for backend to be ready..."
          sleep 10
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3000/hello > /dev/null 2>&1; then
              echo "✅ Backend healthy at /hello (attempt $i)"
              curl -s http://127.0.0.1:3000/hello | head -c 200
              break
            elif curl -sf http://127.0.0.1:3000/health > /dev/null 2>&1; then
              echo "✅ Backend healthy at /health (attempt $i)"
              break
            elif curl -sf http://127.0.0.1:3000/ > /dev/null 2>&1; then
              echo "✅ Backend responding at / (attempt $i)"
              break
            fi
            echo "⏳ Waiting for backend ($i/20)..."
            sleep 4
          done
          curl -sf http://127.0.0.1:3000/hello || \
          curl -sf http://127.0.0.1:3000/health || \
          curl -sf http://127.0.0.1:3000/ || \
          (
            echo "❌ Backend not responding. Logs:"
            docker logs --tail 80 chat_django_daphne
            docker ps -a --filter "name=chat_"
            exit 1
          )

      # ── Nginx public check ─────────────────────────────────────────────────
      - name: Frontend (Nginx) health check
        run: |
          [ -f "/opt/chat-app/frontend/index.html" ] && echo "✅ Frontend index.html present" || echo "⚠️ index.html missing"
          curl -sf http://127.0.0.1/hello || curl -sf http://127.0.0.1/ || echo "⚠️ Nginx not yet serving — check nginx.conf"

      # ── Final state ────────────────────────────────────────────────────────
      - name: Post-deploy container status
        if: always()
        run: |
          echo "📦 Container status:"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          echo ""
          echo "💾 Disk usage after deploy:"
          df -h /
          echo ""
          echo "🏁 Deploy complete — http://16.113.127.132"

      - name: Final Docker image prune
        run: docker image prune -f || true
