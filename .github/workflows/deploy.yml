name: Production CI/CD Pipeline (Build, Test, Scan & Deploy)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE_DJANGO: nikhil2523/chat-app-django
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || 'nikhil2523' }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  CLIENT_URL: ${{ secrets.CLIENT_URL || 'http://16.113.127.132' }}
  VITE_SERVER: ${{ secrets.VITE_SERVER || '' }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 – Backend Quality Gate
  # ═══════════════════════════════════════════════════════════════════════════
  backend_quality:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_server
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: django_server/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── Django system check ──────────────────────────────────────────────
      - name: Django system check
        run: |
          DB_ENGINE=sqlite3 python manage.py check
        env:
          SECRET_KEY: ci-test-secret-key-12345
          DB_ENGINE: sqlite3
          USE_REDIS: "False"
          DEBUG: "True"
          MESSAGE_ENCRYPTION_KEY: "12345678901234567890123456789012"

      # ── Syntax check ─────────────────────────────────────────────────────
      - name: Validate Python syntax
        run: |
          python -c "import ast, glob; [ast.parse(open(f, encoding='utf-8').read()) for f in glob.glob('**/*.py', recursive=True)]; print('✅ All Python files have valid syntax!')"

      # ── Flake8 linting ───────────────────────────────────────────────────
      - name: Flake8 lint
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=migrations,__pycache__,.git \
            --extend-ignore=E501,W503 || true
        continue-on-error: true

      # ── Black formatting check ────────────────────────────────────────────
      - name: Black format check
        run: |
          pip install black
          black --check --line-length 120 . --exclude "migrations|__pycache__" || true
        continue-on-error: true

      # ── Bandit security scan ─────────────────────────────────────────────
      - name: Bandit security scan
        run: |
          pip install bandit
          bandit -r apps/ core/ \
            -x apps/authentication/migrations,apps/chat/migrations,apps/messages_app/migrations \
            --severity-level medium \
            --confidence-level medium \
            -f json -o bandit-report.json || true
          bandit -r apps/ core/ \
            -x apps/authentication/migrations,apps/chat/migrations,apps/messages_app/migrations \
            --severity-level medium \
            --confidence-level medium || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: django_server/bandit-report.json
          retention-days: 14

      # ── pytest ───────────────────────────────────────────────────────────
      - name: Run backend tests with coverage
        run: |
          pip install pytest pytest-django pytest-asyncio pytest-cov factory-boy faker channels[daphne]
          DB_ENGINE=sqlite3 pytest tests/ \
            --cov=apps \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -v \
            --timeout=60
        env:
          SECRET_KEY: ci-test-secret-key-12345
          DB_ENGINE: sqlite3
          USE_REDIS: "False"
          DEBUG: "True"
          MESSAGE_ENCRYPTION_KEY: "12345678901234567890123456789012"
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: django_server/coverage.xml
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 – Frontend Quality Gate + Production Build
  # ═══════════════════════════════════════════════════════════════════════════
  frontend_quality:
    name: Frontend Quality Gate & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: ESLint check
        run: npm run lint || true
        continue-on-error: true

      - name: Build React SPA (production)
        env:
          VITE_SERVER: ${{ env.VITE_SERVER }}
        run: npm run build:ci

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/dist/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 – SonarCloud Analysis (optional – runs if SONAR_TOKEN is set)
  # ═══════════════════════════════════════════════════════════════════════════
  sonar_analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [backend_quality]
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: django_server/

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY || 'chat-app' }}
            -Dsonar.organization=${{ secrets.SONAR_ORG || 'nikhilchandurkar' }}
            -Dsonar.sources=django_server/apps,client/src
            -Dsonar.exclusions=**/migrations/**,**/node_modules/**,**/dist/**,**/__pycache__/**
            -Dsonar.python.coverage.reportPaths=django_server/coverage.xml
            -Dsonar.python.version=3.12

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4 – Build & Push Docker Image
  # ═══════════════════════════════════════════════════════════════════════════
  build_and_push:
    name: Build & Push Docker Image
    needs: [backend_quality, frontend_quality]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Django Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./django_server
          file: ./django_server/Dockerfile
          push: ${{ env.DOCKER_PASSWORD != '' }}
          tags: |
            ${{ env.DOCKER_IMAGE_DJANGO }}:latest
            ${{ env.DOCKER_IMAGE_DJANGO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 5 – Trivy Container Security Scan
  # ═══════════════════════════════════════════════════════════════════════════
  trivy_scan:
    name: Trivy Container Scan
    needs: build_and_push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE_DJANGO }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
        continue-on-error: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 6 – Deploy to EC2 Self-Hosted Runner
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to EC2 Server
    needs: [backend_quality, frontend_quality, build_and_push]
    runs-on: [self-hosted, linux]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository on server
        uses: actions/checkout@v4

      # ── Clean up orphaned Docker resources before deploy ─────────────────
      - name: Docker system prune (safe cleanup)
        run: |
          echo "🧹 Removing stopped containers and dangling images..."
          docker container prune -f || true
          docker image prune -f || true
          docker volume prune -f --filter "label!=keep" || true
          echo "✅ Docker cleanup complete"

      - name: Setup deployment directories
        run: |
          sudo mkdir -p /opt/chat-app/{frontend,redis_data,media,logs}
          sudo chown -R $USER:$USER /opt/chat-app
          sudo chmod -R 775 /opt/chat-app

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: /tmp/frontend_dist

      - name: Deploy frontend static files
        run: |
          rm -rf /opt/chat-app/frontend/*
          cp -r /tmp/frontend_dist/* /opt/chat-app/frontend/
          rm -rf /tmp/frontend_dist
          echo "✅ Frontend deployed to /opt/chat-app/frontend/"

      - name: Update Nginx configuration
        run: |
          if [ -f "nginx.conf" ]; then
            sudo cp nginx.conf /etc/nginx/sites-available/chatapp
            sudo ln -sf /etc/nginx/sites-available/chatapp /etc/nginx/sites-enabled/chatapp
            sudo nginx -t && (sudo systemctl restart nginx || sudo systemctl reload nginx) && echo "✅ Nginx active" || echo "⚠️ Nginx config check failed"
          fi

      - name: Login to Docker Hub
        run: |
          if [ -n "${{ env.DOCKER_PASSWORD }}" ]; then
            echo "${{ env.DOCKER_PASSWORD }}" | docker login -u "${{ env.DOCKER_USERNAME }}" --password-stdin
          fi

      - name: Pull latest Django image
        run: docker pull ${{ env.DOCKER_IMAGE_DJANGO }}:latest

      # ── Stop legacy Node.js containers ───────────────────────────────────
      - name: Remove legacy Node.js backend containers
        run: |
          for c in chat_app nodejs-app-container node_backend; do
            if docker ps -a --format '{{.Names}}' | grep -q "^${c}$"; then
              echo "Removing legacy container: $c"
              docker stop $c 2>/dev/null || true
              docker rm $c 2>/dev/null || true
            fi
          done
          echo "✅ Legacy containers removed"

      # ── Remove old PostgreSQL container (switching to MySQL) ─────────────
      - name: Remove legacy PostgreSQL container
        run: |
          for c in chat_postgres; do
            if docker ps -a --format '{{.Names}}' | grep -q "^${c}$"; then
              echo "Removing legacy PostgreSQL container: $c"
              docker stop $c 2>/dev/null || true
              docker rm $c 2>/dev/null || true
            fi
          done
          echo "✅ Legacy PostgreSQL removed"

      # ── MySQL ──────────────────────────────────────────────────────────────
      - name: Ensure MySQL 8 container is running
        run: |
          if ! docker ps --format '{{.Names}}' | grep -q '^chat_mysql$'; then
            echo "🐬 MySQL not running — starting..."
            docker rm chat_mysql 2>/dev/null || true
            sudo mkdir -p /opt/chat-app/mysql_data
            sudo chown -R 999:999 /opt/chat-app/mysql_data 2>/dev/null || true
            docker run -d \
              --name chat_mysql \
              --restart unless-stopped \
              -e MYSQL_DATABASE=chat_db \
              -e MYSQL_USER=chat_user \
              -e MYSQL_PASSWORD=chat_password \
              -e MYSQL_ROOT_PASSWORD=chat_root_password \
              -v /opt/chat-app/mysql_data:/var/lib/mysql \
              -p 127.0.0.1:3306:3306 \
              mysql:8.0 \
              --character-set-server=utf8mb4 \
              --collation-server=utf8mb4_unicode_ci \
              --default-authentication-plugin=mysql_native_password
            sleep 15
            echo "✅ MySQL started"
          else
            echo "✅ MySQL already running"
          fi
          # Wait until MySQL is accepting connections
          for i in $(seq 1 20); do
            if docker exec chat_mysql mysqladmin ping -u chat_user -pchat_password --silent 2>/dev/null; then
              echo "✅ MySQL accepting connections"
              break
            fi
            echo "Waiting for MySQL ($i/20)..."
            sleep 3
          done

      # ── Redis ─────────────────────────────────────────────────────────────
      - name: Ensure Redis 7 container is running
        run: |
          if ! docker ps --format '{{.Names}}' | grep -q '^chat_redis$'; then
            docker run -d \
              --name chat_redis \
              --restart unless-stopped \
              -p 6379:6379 \
              -v /opt/chat-app/redis_data:/data \
              redis:7-alpine redis-server --appendonly yes
            sleep 3
            echo "✅ Redis started"
          else
            echo "✅ Redis already running"
          fi

      # ── Run migrations ─────────────────────────────────────────────────────
      - name: Apply database migrations
        run: |
          echo "Setting up MySQL database & user privileges..."
          docker exec chat_mysql mysql -uroot -pchat_root_password -e "
            CREATE DATABASE IF NOT EXISTS chat_db;
            CREATE USER IF NOT EXISTS 'chat_user'@'%' IDENTIFIED WITH mysql_native_password BY 'chat_password';
            ALTER USER 'chat_user'@'%' IDENTIFIED WITH mysql_native_password BY 'chat_password';
            GRANT ALL PRIVILEGES ON chat_db.* TO 'chat_user'@'%';
            FLUSH PRIVILEGES;
          " 2>/dev/null || echo "MySQL root grant completed"

          echo "Applying Django migrations..."
          docker run --rm \
            --network host \
            -e DB_ENGINE=mysql \
            -e MYSQL_DATABASE=chat_db \
            -e MYSQL_USER=chat_user \
            -e MYSQL_PASSWORD=chat_password \
            -e MYSQL_HOST=127.0.0.1 \
            -e MYSQL_PORT=3306 \
            -e REDIS_URL="redis://127.0.0.1:6379/0" \
            -e USE_REDIS="True" \
            -e SECRET_KEY='${{ secrets.DJANGO_SECRET_KEY || 'django-insecure-chat-app-production-secret-key-321' }}' \
            -e MESSAGE_ENCRYPTION_KEY='${{ secrets.MESSAGE_ENCRYPTION_KEY || '12345678901234567890123456789012' }}' \
            -e DEBUG=False \
            ${{ env.DOCKER_IMAGE_DJANGO }}:latest \
            sh -c "python manage.py migrate --noinput || python manage.py migrate --noinput --fake-initial"
        continue-on-error: false

      # ── Deploy Daphne ASGI ─────────────────────────────────────────────────
      - name: Start / update Django Daphne server (port 3000)
        run: |
          docker stop chat_django_daphne 2>/dev/null || true
          docker rm chat_django_daphne 2>/dev/null || true
          docker run -d \
            --name chat_django_daphne \
            --restart unless-stopped \
            --network host \
            -e PORT=3000 \
            -e DEBUG=False \
            -e SECRET_KEY='${{ secrets.DJANGO_SECRET_KEY || 'django-insecure-chat-app-production-secret-key-321' }}' \
            -e ADMIN_SECRET_KEY='${{ secrets.ADMIN_SECRET_KEY || 'chat_app_secret' }}' \
            -e DB_ENGINE=mysql \
            -e MYSQL_DATABASE=chat_db \
            -e MYSQL_USER=chat_user \
            -e MYSQL_PASSWORD='${{ secrets.MYSQL_PASSWORD || 'chat_password' }}' \
            -e MYSQL_HOST=127.0.0.1 \
            -e MYSQL_PORT=3306 \
            -e DB_CONN_MAX_AGE=600 \
            -e REDIS_URL='redis://127.0.0.1:6379/0' \
            -e USE_REDIS='True' \
            -e CLIENT_URL='${{ env.CLIENT_URL }}' \
            -e ALLOWED_HOSTS='${{ secrets.ALLOWED_HOSTS || '*' }}' \
            -e EMAIL_HOST='smtp.gmail.com' \
            -e EMAIL_PORT=587 \
            -e EMAIL_SECURE=false \
            -e EMAIL_USER='${{ secrets.EMAIL_USER }}' \
            -e EMAIL_PASS='${{ secrets.EMAIL_PASS }}' \
            -e MESSAGE_ENCRYPTION_KEY='${{ secrets.MESSAGE_ENCRYPTION_KEY || '12345678901234567890123456789012' }}' \
            -v /opt/chat-app/media:/app/media \
            -v /opt/chat-app/logs:/app/logs \
            ${{ env.DOCKER_IMAGE_DJANGO }}:latest

      # ── Deploy Celery Worker ───────────────────────────────────────────────
      - name: Start / update Celery worker
        run: |
          docker stop chat_celery_worker 2>/dev/null || true
          docker rm chat_celery_worker 2>/dev/null || true
          docker run -d \
            --name chat_celery_worker \
            --restart unless-stopped \
            --network host \
            -e DEBUG=False \
            -e SECRET_KEY='${{ secrets.DJANGO_SECRET_KEY || 'django-insecure-chat-app-production-secret-key-321' }}' \
            -e DB_ENGINE=mysql \
            -e MYSQL_DATABASE=chat_db \
            -e MYSQL_USER=chat_user \
            -e MYSQL_PASSWORD='${{ secrets.MYSQL_PASSWORD || 'chat_password' }}' \
            -e MYSQL_HOST=127.0.0.1 \
            -e MYSQL_PORT=3306 \
            -e DB_CONN_MAX_AGE=600 \
            -e REDIS_URL='redis://127.0.0.1:6379/0' \
            -e USE_REDIS='True' \
            -e CELERY_CONCURRENCY=2 \
            -e EMAIL_USER='${{ secrets.EMAIL_USER }}' \
            -e EMAIL_PASS='${{ secrets.EMAIL_PASS }}' \
            -e MESSAGE_ENCRYPTION_KEY='${{ secrets.MESSAGE_ENCRYPTION_KEY || '12345678901234567890123456789012' }}' \
            -v /opt/chat-app/media:/app/media \
            ${{ env.DOCKER_IMAGE_DJANGO }}:latest \
            celery -A core worker -l info --concurrency=2 --max-memory-per-child=150000

      # ── Health check ───────────────────────────────────────────────────────
      - name: Verify backend health
        run: |
          sleep 8
          for i in $(seq 1 12); do
            if curl -s -f http://127.0.0.1:3000/hello > /dev/null; then
              echo "✅ Daphne backend healthy on port 3000 (attempt $i)"
              break
            fi
            echo "Waiting for backend ($i/12)..."
            sleep 3
          done
          curl -f http://127.0.0.1:3000/hello || (
            echo "❌ Health check failed. Last 50 lines:"
            docker logs --tail 50 chat_django_daphne
            exit 1
          )

      - name: Verify frontend deployment
        run: |
          [ -f "/opt/chat-app/frontend/index.html" ] && echo "✅ Frontend index.html present" || echo "⚠️ Frontend index.html missing"

      # ── Final cleanup ──────────────────────────────────────────────────────
      - name: Final Docker cleanup
        run: |
          docker image prune -f
          echo "🏁 Deploy complete"
