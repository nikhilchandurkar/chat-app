name: Production EC2 Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2 Ubuntu LTS
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "[+] Executing automated deployment script..."
            if [ -f /srv/chatapp/deploy/scripts/deploy.sh ]; then
              chmod +x /srv/chatapp/deploy/scripts/deploy.sh
              /srv/chatapp/deploy/scripts/deploy.sh
            else
              cd /srv/chatapp
              git pull origin main
              cd django_server
              source venv/bin/activate
              pip install -r requirements.txt
              python manage.py migrate --noinput
              python manage.py collectstatic --noinput
              cd ../client
              npm ci && npm run build
              sudo cp -r dist/* /var/www/chatapp/
              sudo systemctl restart chat-asgi chat-outbox chat-celery chat-celery-beat
              sudo systemctl reload nginx
            fi
            echo "[✓] Deployment completed."
