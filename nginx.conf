# ==============================================================================
# Nginx Reverse Proxy – Chat Application
#
# Serves:
#   /           → React SPA static files
#   /api/       → Django Daphne ASGI (port 3000)
#   /ws         → Django Channels WebSocket (same Daphne port 3000)
#   /admin/     → Django admin
#
# HTTP → HTTPS redirect (uses Let's Encrypt certs via Certbot)
# ==============================================================================

# WebSocket connection upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limiting zones
limit_req_zone  $binary_remote_addr  zone=api_limit:10m  rate=10r/s;
limit_req_zone  $binary_remote_addr  zone=auth_limit:5m  rate=3r/s;
limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

# Optional IP blacklisting (add IPs below with value 1)
map $remote_addr $is_blacklisted {
    default 0;
    # 1.2.3.4 1;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name nikhil-chats.chickenkiller.com;

    if ($is_blacklisted) { return 403; }

    return 301 https://$host$request_uri;
}

# ── Main HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name nikhil-chats.chickenkiller.com;

    if ($is_blacklisted) { return 403; }

    # SSL (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/nikhil-chats.chickenkiller.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nikhil-chats.chickenkiller.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff                always;
    add_header X-Frame-Options           DENY                   always;
    add_header X-XSS-Protection          "1; mode=block"        always;
    add_header Referrer-Policy           "strict-origin"        always;

    # Max upload size (matches Django DATA_UPLOAD_MAX_MEMORY_SIZE)
    client_max_body_size 25M;

    # ── 1. React SPA (static files) ─────────────────────────────────────────
    location / {
        root  /opt/chat-app/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── 2. Django REST API ──────────────────────────────────────────────────
    location /api/ {
        limit_req  zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 20;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── 3. Django Admin ─────────────────────────────────────────────────────
    location /admin/ {
        limit_req  zone=auth_limit burst=5 nodelay;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 4. Django Channels WebSocket ────────────────────────────────────────
    # NOTE: Django Channels uses /ws (not /socket.io/)
    location /ws {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering for WebSockets
        proxy_buffering    off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
