# ==============================================================================
# Nginx Reverse Proxy — Chat App (Production)
#
# Stack:
#   React SPA  → served from /opt/chat-app/frontend
#   Django API → proxied to Daphne on 127.0.0.1:3000
#   WebSocket  → proxied via /ws to same Daphne port
#   Admin      → /admin/ → Daphne
#   Media      → /api/v1/media/ → Daphne
#
# HTTP (port 80) serves directly — no SSL redirect until cert is installed.
# Run certbot to enable HTTPS block.
# ==============================================================================

# ── Rate limiting zones ───────────────────────────────────────────────────────
limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=20r/s;
limit_req_zone  $binary_remote_addr zone=auth_limit:5m  rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── WebSocket upgrade map ─────────────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Optional IP blacklist ─────────────────────────────────────────────────────
map $remote_addr $is_blacklisted {
    default 0;
    # 1.2.3.4 1;
}

# ══════════════════════════════════════════════════════════════════════════════
# HTTP server (port 80) — serves everything directly
# Upgrade to HTTPS later with: sudo certbot --nginx
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name 16.113.127.132 nikhil-chats.chickenkiller.com _;

    if ($is_blacklisted) { return 403; }

    # Max upload size (matches Django DATA_UPLOAD_MAX_MEMORY_SIZE)
    client_max_body_size 25M;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  nosniff         always;
    add_header X-Frame-Options         SAMEORIGIN       always;
    add_header X-XSS-Protection        "1; mode=block"  always;
    add_header Referrer-Policy         "strict-origin"  always;

    # ── 1. React SPA ──────────────────────────────────────────────────────────
    root  /opt/chat-app/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache hashed assets forever (Vite fingerprints them)
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ── 2. Django REST API ────────────────────────────────────────────────────
    location /api/ {
        limit_req  zone=api_limit burst=40 nodelay;
        limit_conn conn_limit 30;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── 3. Django Admin ───────────────────────────────────────────────────────
    location /admin/ {
        limit_req  zone=auth_limit burst=10 nodelay;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── 4. Health / Hello (direct Django) ────────────────────────────────────
    location ~ ^/(hello|health)(/?)$ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── 5. Django Channels WebSocket ──────────────────────────────────────────
    location /ws {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── 6. Socket.io compat ───────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_buffering    off;
        proxy_read_timeout 86400s;
    }

    # ── 7. Django Media ───────────────────────────────────────────────────────
    location /api/v1/media/ {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
