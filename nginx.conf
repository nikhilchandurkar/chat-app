# ==============================================================================
# Nginx Reverse Proxy – Chat Application (Production)
# Supports both direct IP access (16.113.127.132) and domain names
# ==============================================================================

# Rate limiting zones
limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=10r/s;
limit_req_zone  $binary_remote_addr zone=auth_limit:5m  rate=3r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# WebSocket connection upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 16.113.127.132 nikhil-chats.chickenkiller.com _;

    # Security headers
    add_header X-Content-Type-Options  nosniff          always;
    add_header X-Frame-Options         DENY             always;
    add_header X-XSS-Protection        "1; mode=block"  always;

    # Max upload size
    client_max_body_size 25M;

    # ── 1. React SPA (static frontend) ────────────────────────────────────────
    root  /opt/chat-app/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache hashed static assets
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ── 2. Django REST API ────────────────────────────────────────────────────
    location /api/ {
        limit_req  zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 20;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── 3. Django Admin ───────────────────────────────────────────────────────
    location /admin/ {
        limit_req  zone=auth_limit burst=5 nodelay;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 4. Django Channels WebSockets ─────────────────────────────────────────
    location /ws {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── 5. Socket.io WebSockets (compatibility) ──────────────────────────────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_buffering    off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── 6. Django Media Files ─────────────────────────────────────────────────
    location /api/v1/media/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host $host;
    }
}
