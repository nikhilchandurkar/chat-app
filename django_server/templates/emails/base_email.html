<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject|default:"ChatApp Security" }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F7F7F5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #202421;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      background-color: #F7F7F5;
      padding: 40px 0;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(32, 36, 33, 0.05);
      border: 1px solid #E3E6E1;
    }
    .header {
      background-color: #236B4A;
      padding: 24px 32px;
      text-align: center;
    }
    .logo-text {
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .content {
      padding: 32px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #202421;
      margin-top: 0;
      margin-bottom: 16px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #737A75;
      margin: 0 0 16px 0;
    }
    .code-box {
      background-color: #F1F2EF;
      border: 2px dashed #E3E6E1;
      border-radius: 6px;
      padding: 20px;
      text-align: center;
      margin: 24px 0;
    }
    .otp-code {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #236B4A;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
    }
    .alert-box {
      background-color: #FADBD8;
      border-left: 4px solid #C0392B;
      padding: 14px 18px;
      border-radius: 0 6px 6px 0;
      margin: 20px 0;
      font-size: 14px;
      color: #900C3F;
    }
    .info-box {
      background-color: #E8F3ED;
      border-left: 4px solid #236B4A;
      padding: 14px 18px;
      border-radius: 0 6px 6px 0;
      margin: 20px 0;
      font-size: 14px;
      color: #1B573C;
    }
    .button {
      display: inline-block;
      background-color: #236B4A;
      color: #ffffff !important;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 6px;
      margin: 16px 0;
    }
    .footer {
      background-color: #F7F7F5;
      padding: 24px 32px;
      border-top: 1px solid #E3E6E1;
      text-align: center;
      font-size: 12px;
      color: #737A75;
      line-height: 1.5;
    }
    .footer a {
      color: #236B4A;
      text-decoration: underline;
    }
    .badge {
      display: inline-block;
      background-color: #E8F3ED;
      color: #236B4A;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <div class="logo-text">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle; margin-right: 8px;">
            <path d="M12 2C6.48 2 2 6.48 2 12C2 13.85 2.5 15.58 3.38 17.07L2.1 21.9C2.02 22.21 2.3 22.48 2.61 22.4L7.44 21.12C8.93 22 10.66 22.5 12.51 22.5C18.03 22.5 22.51 18.02 22.51 12.5C22.51 6.98 18.03 2 12.51 2H12Z" fill="#ffffff" fill-opacity="0.95"/>
            <circle cx="8" cy="12" r="1.5" fill="#236B4A"/>
            <circle cx="12" cy="12" r="1.5" fill="#236B4A"/>
            <circle cx="16" cy="12" r="1.5" fill="#236B4A"/>
          </svg>
          {{ app_name|default:"ChatApp" }}
        </div>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        <p>This is an automated security message from {{ app_name|default:"ChatApp" }}. Please do not reply directly to this email.</p>
        <p>&copy; {% now "Y" %} {{ app_name|default:"ChatApp" }} Inc. All rights reserved.</p>
      </div>
    </div>
  </div>
</body>
</html>
