<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChitChat - Secure Real-Time Messaging</title>
    <meta name="description" content="A fast, private, and secure self-hosted real-time messaging platform." />
    <meta name="theme-color" content="#236B4A" />
    <meta name="keywords" content="chat, messaging, secure, fast, modern" />

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
    </noscript>

    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { font-size: 16px; }
      body {
        margin: 0;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #F7F7F5;
      }
      #root { min-height: 100vh; }
      @media print {
        body.chitchat-screen-protected { display: none !important; }
      }
    </style>
    <script>
      (function () {
        try {
          var isNative = Boolean(
            window.Capacitor &&
              typeof window.Capacitor.isNativePlatform === "function" &&
              window.Capacitor.isNativePlatform()
          );
          if (isNative || window.location.pathname !== "/login") return;
          var params = new URLSearchParams(window.location.search);
          var state = params.get("state") || "";
          if (
            (state === "google_android" || state === "github_android") &&
            (params.get("code") || params.get("error"))
          ) {
            var target = "com.nikhil.chatapp://oauth/callback" + window.location.search;
            window.__chitchatAndroidOAuthTarget = target;
            window.location.replace(target);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
