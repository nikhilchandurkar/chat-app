# ==============================================================================
# Nginx Reverse Proxy — Chat App (HTTPS / SSL Production)
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream chat_wsgi_upstream {
    least_conn;
    server 127.0.0.1:3010 max_fails=0;
    server 127.0.0.1:3011 max_fails=0;
    keepalive 128;
}

upstream chat_ws_upstream {
    least_conn;
    server 127.0.0.1:3000 max_fails=0;
    server 127.0.0.1:3001 max_fails=0;
    keepalive 128;
}

# ── 1. HTTP Server (Port 80) — ACME Challenge & HTTPS Redirection ───────────
server {
    listen 80;
    listen [::]:80;
    server_name chat-nikkiii.duckdns.org;

    # Let's Encrypt validation endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS permanently
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 2. HTTPS Server (Port 443) — TLS + Static SPA + Daphne Proxy + WSS ───────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat-nikkiii.duckdns.org;

    # Let's Encrypt TLS Certificates
    ssl_certificate     /etc/letsencrypt/live/chat-nikkiii.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-nikkiii.duckdns.org/privkey.pem;

    # SSL protocols & modern cipher configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security & HSTS headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-XSS-Protection          "1; mode=block" always;

    # Compression & low-disk buffered access logs
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    access_log /var/log/nginx/access.log combined buffer=64k flush=5s;

    # Maximum payload size (matches 25MB avatar/attachment limits)
    client_max_body_size 25M;

    root  /opt/chat-app/frontend;
    index index.html;

    # ── Django Admin & DRF static files ───────────────────────────────────────
    location ^~ /static/ {
        alias              /opt/chat-app/staticfiles/;
        expires            7d;
        add_header         Cache-Control "public";
        access_log         off;
    }

    # ── React SPA static files ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Cache compiled chunks and static assets forever
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ── Let's Encrypt renew challenge ─────────────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # ── Django REST API (Dedicated Multi-Thread WSGI Workers) ─────────────────
    location /api/ {
        proxy_pass         http://chat_wsgi_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Django Admin ──────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://chat_wsgi_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
    }

    # ── Health / Hello direct checks ──────────────────────────────────────────
    location ~ ^/(hello|health)(/?)$ {
        proxy_pass         http://chat_wsgi_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
    }

    # ── WebSockets (Django Channels — Async Daphne Workers) ──────────────────
    location /ws {
        proxy_pass         http://chat_ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /socket.io/ {
        proxy_pass         http://chat_ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        proxy_read_timeout 86400s;
    }

    # ── Django Media (served directly by Nginx from host bind mount) ──────────
    location /api/v1/media/ {
        alias              /opt/chat-app/media/;
        expires            7d;
        add_header         Cache-Control "public";
        access_log         off;
    }
}

